name: Run Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.5', '8.4', '8.3', '8.2']
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-stable]
        exclude:
          - laravel: 13.*
            php: '8.2'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: nova_tags_field
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Configure Nova authentication
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: |
          if [ -z "$NOVA_USERNAME" ]; then
            echo "::error::Missing NOVA_USERNAME Actions secret (Nova account email)."
            exit 1
          fi
          if [ -z "$NOVA_LICENSE_KEY" ]; then
            echo "::error::Missing NOVA_LICENSE_KEY Actions secret (Nova license key)."
            exit 1
          fi
          composer config --global http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --with="laravel/framework:${{ matrix.laravel }}"

      - name: Execute tests
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_USERNAME: root
          DB_DATABASE: nova_tags_field
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] }}

      - name: Setup Node
        if: matrix.php == '8.4' && matrix.laravel == '12.*'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Check assets
        if: matrix.php == '8.4' && matrix.laravel == '12.*'
        run: |
          npm ci
          npm run check-format
          npm run production
          git diff --exit-code -- dist
